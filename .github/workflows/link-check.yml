name: Version 1 QA

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --package-lock=false
      - run: npm run check:links
      - run: npm run build
