name: Version 1 QA

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:frontmatter
      - run: npm run check:links
      - run: npm run build
